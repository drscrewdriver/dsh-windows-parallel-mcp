name: release

# 变体：dsh-windows-parallel-mcp 手写（不走模板渲染）
# 原因：runs-on=windows-latest —— Windows runner 默认 shell 是 PowerShell，
#       跑不了模板里的 bash 语法（[ ] / set -euo pipefail），必须每步显式 shell: bash；
#       且无 ci.yml，gate 按 fallback 顺序（test, check）推导。
# 必须包含：id-token: write + --provenance --access public

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:      { description: '要发布的 tag（如 v0.8.2）', required: true, type: string }
      dry_run:  { description: '只打包不推 npm', type: boolean, default: true }

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # ① 版本对齐
      - name: 版本对齐
        shell: bash
        run: |
          set -euo pipefail
          V="${TAG#v}"
          P=$(node -p "require('./package.json').version")
          [ "$V" = "$P" ] || { echo "::error::tag $TAG 与 package.json $P 不一致"; exit 1; }
          for f in dsh.plugin.json dsh-plugin.json; do
            [ -f "$f" ] || continue
            D=$(node -p "try{require('./$f').version||''}catch{''}" 2>/dev/null || echo "")
            [ -z "$D" ] || [ "$D" = "$P" ] || { echo "::error::$f 的 $D 与 $P 不一致"; exit 1; }
          done
          echo "VERSION=$P"        >> "$GITHUB_ENV"
          echo "PKG_NAME=$(node -p "require('./package.json').name")" >> "$GITHUB_ENV"

      # ② 安装依赖（无 lock → 裸装）
      - name: 安装依赖
        shell: bash
        run: npm install --no-audit --no-fund

      # ③ 门禁（fallback：test 含 check.mjs + plugin-test + worker-smoke；check 单独再跑一次契约校验）
      - name: 门禁
        shell: bash
        run: |
          set -euo pipefail
          npm run test
          npm run check

      # ④ 打包清单
      - name: 打包清单
        shell: bash
        run: npm pack --dry-run

      # ⑤ 幂等
      - name: 幂等检查
        id: guard
        shell: bash
        run: |
          if npm view "$PKG_NAME@$VERSION" version --registry https://registry.npmjs.org 2>/dev/null | grep -q .; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
            echo "::warning::$PKG_NAME@$VERSION 已存在于 registry，跳过"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ⑥ 发布
      - name: npm publish
        if: steps.guard.outputs.exists == 'false' && (github.event_name == 'push' || inputs.dry_run == false)
        shell: bash
        run: npm publish --provenance --access public --registry https://registry.npmjs.org

      # ⑦ dist-tag 同步
      - name: 同步 dsh-* 线标签
        id: disttag
        if: steps.guard.outputs.exists == 'false' && (github.event_name == 'push' || inputs.dry_run == false)
        shell: bash
        run: |
          set -uo pipefail
          REG=https://registry.npmjs.org
          for attempt in 1 2 3 4 5 6; do
            RAW=$(npm view "$PKG_NAME" dist-tags --json --registry "$REG" 2>/dev/null)
            if [ -n "${RAW:-}" ]; then
              TAGS=$(printf '%s' "$RAW" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(Object.keys(JSON.parse(s)).filter(t=>t.startsWith('dsh-')).join(' '))}catch{console.log('')}})")
              if [ -z "${TAGS:-}" ]; then
                echo "::notice::$PKG_NAME 没有 dsh-* 线标签，无需同步"
                echo "synced=none" >> "$GITHUB_OUTPUT"; exit 0
              fi
              ok=1; for t in $TAGS; do npm dist-tag add "$PKG_NAME@$VERSION" "$t" --registry "$REG" || ok=0; done
              [ "$ok" = 1 ] && { echo "synced=$TAGS" >> "$GITHUB_OUTPUT"; exit 0; }
            fi
            echo "第 $attempt 轮未拿到 dist-tags，30s 后重试"; sleep 30
          done
          echo "::warning::线标签同步未完成，需本地补跑"
          echo "synced=PENDING" >> "$GITHUB_OUTPUT"

      # ⑧ GitHub Release
      - name: GitHub Release
        if: steps.guard.outputs.exists == 'false' && (github.event_name == 'push' || inputs.dry_run == false)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          gh release edit "$TAG" --latest

      # ⑨ 事实表
      - name: Job Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### $TAG"
            echo "| 包 | ${PKG_NAME:-?} |"
            echo "| 版本 | ${VERSION:-?} |"
            echo "| 已存在跳过 | ${{ steps.guard.outputs.exists }} |"
            echo "| 线标签 | ${{ steps.disttag.outputs.synced || '-' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
